{% extends 'core/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="card border-0 shadow-lg p-4 text-center" style="max-width:500px; margin:auto; border-radius:20px;">
        <div class="mb-4">
            <div class="bg-danger-subtle d-inline-block rounded-circle p-3 mb-3">
                <i class="bi bi-trash-fill text-danger fs-2"></i>
            </div>
            <h4 class="fw-bold text-dark">Confirm Deletion</h4>
            <p class="text-muted">Are you sure you want to remove this donation? This action cannot be undone.</p>
        </div>

        <div class="bg-light p-3 rounded-4 mb-4">
            <h6 class="fw-bold text-success mb-1">{{ donation.event.name }}</h6>
            <p class="small text-muted mb-0">{{ donation.description|truncatechars:50 }}</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-danger rounded-pill py-2 fw-bold shadow-sm">Yes, Delete Permanently</button>
                <a href="{% url 'dashboard' %}" class="btn btn-light rounded-pill py-2 text-muted">Keep Donation</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

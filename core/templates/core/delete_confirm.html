{% extends 'core/base.html' %}

{% block content %}

<div class="container mt-5">
    <div class="card shadow-lg p-4 text-center" style="max-width:500px; margin:auto; border-radius:15px;">

        <h4 class="text-danger mb-3">⚠️ Delete Donation</h4>

        <p>
            Are you sure you want to delete this donation?
        </p>

        <p class="text-muted">
            <strong>{{ donation.description }}</strong>
        </p>

        <form method="post">
            {% csrf_token %}
            
            <button class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary ms-2">Cancel</a>
        </form>

    </div>
</div>

{% endblock %}

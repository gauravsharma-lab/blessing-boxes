{% extends 'core/base.html' %}

{% block content %}

<div class="container mt-5">
    <div class="card shadow-lg p-4" style="max-width:600px; margin:auto; border-radius:15px;">

        <h3 class="text-success mb-4 text-center">✏️ Edit Donation</h3>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label>Description</label>
                {{ form.description }}
            </div>

            <div class="mb-3">
                <label>Quantity</label>
                {{ form.quantity }}
            </div>

            <div class="mb-3">
                <label>Mobile Number</label>
                {{ form.phone_number }}
            </div>

            <div class="mb-3">
                <label>Available Until</label>
                {{ form.available_until }}
            </div>

            <div class="d-grid">
                <button class="btn btn-success">Update Donation</button>
            </div>
        </form>

    </div>
</div>

{% endblock %}

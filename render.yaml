services:
  - type: web
    name: blessing-boxes
    env: python
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate && python manage.py shell -c \"from django.contrib.auth.models import User; u, _ = User.objects.get_or_create(username='Admin'); u.set_password('Gaurav'); u.is_superuser=True; u.is_staff=True; u.save()\" && gunicorn blessingboxes.wsgi --workers 1 --threads 8 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "blessing-boxes.onrender.com"

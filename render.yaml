services:
  - type: web
    name: blessing-boxes
    env: python
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate && python manage.py shell -c \"from django.contrib.auth.models import User; User.objects.filter(username='Admin').exists() or User.objects.create_superuser('Admin', 'blessingsboxes5@gmail.com', 'Gaurav')\" && gunicorn blessingboxes.wsgi --workers 1 --threads 8 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "blessing-boxes.onrender.com"

services:
  - type: web
    name: blessing-boxes
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn blessingboxes.wsgi"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "blessing-boxes.onrender.com"
